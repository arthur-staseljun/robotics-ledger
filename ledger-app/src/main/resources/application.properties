spring.application.name=robotics-ledger-app

logging.pattern.level=%5p [clientId=%X{clientId} key=%X{idempotencyKey}]

spring.datasource.url=jdbc:postgresql://localhost:5432/ledger
spring.datasource.username=ledger
spring.datasource.password=ledger

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ledger-transfers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=1

ledger.consumer.partitions=9
ledger.consumer.replicas=1
ledger.consumer.retry-interval-ms=1000

ledger.history.default-limit=50
ledger.history.max-limit=100

ledger.reconciliation.cron=0 0 3 * * *
ledger.reconciliation.pending-timeout=5m
ledger.reconciliation.outbox-timeout=2m
