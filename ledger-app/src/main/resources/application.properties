spring.application.name=robotics-ledger-app

logging.pattern.level=%5p [clientId=%X{clientId} key=%X{idempotencyKey}]

spring.datasource.url=jdbc:postgresql://localhost:5432/ledger
spring.datasource.username=ledger
spring.datasource.password=ledger

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=1

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

ledger.kafka.topics.transfers.partitions=9
ledger.kafka.topics.transfers-dlq.partitions=1
ledger.kafka.replication-factor=1
ledger.kafka.consumer.transfers.group-id=ledger-transfers
ledger.kafka.consumer.retry-interval=1s

ledger.history.default-limit=50
ledger.history.max-limit=100

# set the cron to "-" to turn the job off on all but one instance
ledger.reconciliation-job.cron=0 0 3 * * *
ledger.reconciliation-job.pending-timeout=5m
ledger.reconciliation-job.outbox-timeout=2m

management.endpoints.web.exposure.include=health,prometheus
