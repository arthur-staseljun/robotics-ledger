spring.application.name=robotics-ledger-relay

spring.datasource.url=jdbc:postgresql://localhost:5432/ledger
spring.datasource.username=ledger
spring.datasource.password=ledger

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=10000

ledger.relay.initial-delay-ms=0
ledger.relay.delay-ms=500
ledger.relay.batch-size=100
ledger.relay.send-timeout=10s
ledger.relay.partitions=3
ledger.relay.replicas=1
